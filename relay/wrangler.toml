# Gubernos relay: bug reports from people's installs → issues in a private repo (worker.js).
# Deploy (developer, once): npx wrangler login && npx wrangler secret put GITHUB_TOKEN && npx wrangler secret put KEY_SECRET
#   && npx wrangler deploy   (from this folder)
name = "gubernos-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "relay.gubernos.app", custom_domain = true }]

[vars]
FEEDBACK_REPO = "old-bozman/gubernos-feedback"

# 5 reports a minute per IP
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
