# Gubernos relay (worker.js): bug reports from people's installs → issues in a private repo; Apple Push for their iPhones.
# Deploy (developer, once): npx wrangler login, then secrets GITHUB_TOKEN, KEY_SECRET, CF_API_TOKEN and APNS_KEY (the .p8:
#   npx wrangler secret put APNS_KEY < ~/.config/gubernos/apns.p8), then npx wrangler deploy   (from this folder)
name = "gubernos-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "relay.gubernos.app", custom_domain = true }]

# no Workers Logs: report texts and push alerts pass through, nothing is kept
[observability]
enabled = false

[vars]
FEEDBACK_REPO = "old-bozman/gubernos-feedback"
APNS_KEY_ID = "9G4AAJ4UYJ"
APNS_TEAM_ID = "JGXLFTDAZ2"
APNS_TOPIC = "app.gubernos"
# a separate domain for the Macs' addresses: anyone can get a tunnel, so a bad page there can't hurt gubernos.app
TUNNEL_DOMAIN = "gubernos.dev"
CF_ACCOUNT_ID = "d783ff8d4774b998bfccd91f53ded87b"
CF_ZONE_ID = "756eae3e950f8092ec7bf7e9051abfee"
# the check before a new tunnel (GET /check): the Turnstile widget for relay.gubernos.app (its secret: wrangler secret put TURNSTILE_SECRET)
TURNSTILE_SITEKEY = "0x4AAAAAAF7MxRBpJ106YeLC"
# new tunnels a day in all; reaching it, or ALERT_TOTAL on the account (Cloudflare's limit: 1,000), opens an alert issue
DAILY_TUNNELS = "30"
ALERT_TOTAL = "800"

# granted check codes (10 minutes) and the day's count of new tunnels
[[kv_namespaces]]
binding = "TUNNELS"
id = "90488fcbf07e49a19bcfe53f2568ae52"

# 5 reports a minute per IP
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 60 pushes a minute per IP
[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# 3 new tunnels a minute per IP (a Mac makes one, once); also checks passed
[[ratelimits]]
name = "TUNNEL_LIMIT"
namespace_id = "1003"
simple = { limit = 3, period = 60 }
