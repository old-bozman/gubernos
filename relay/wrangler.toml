# Gubernos relay (worker.js): bug reports from people's installs → issues in a private repo; Apple Push for their iPhones.
# Deploy (developer, once): npx wrangler login, then secrets GITHUB_TOKEN, KEY_SECRET and APNS_KEY (the .p8:
#   npx wrangler secret put APNS_KEY < ~/.config/gubernos/apns.p8), then npx wrangler deploy   (from this folder)
name = "gubernos-relay"
main = "worker.js"
compatibility_date = "2026-10-01"
routes = [{ pattern = "relay.gubernos.app", custom_domain = true }]

[vars]
FEEDBACK_REPO = "old-bozman/gubernos-feedback"
APNS_KEY_ID = "9G4AAJ4UYJ"
APNS_TEAM_ID = "JGXLFTDAZ2"
APNS_TOPIC = "app.gubernos"

# 5 reports a minute per IP
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 60 pushes a minute per IP
[[ratelimits]]
name = "PUSH_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }
